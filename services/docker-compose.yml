services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mq3
      POSTGRES_PASSWORD: mq3
      POSTGRES_DB: mq3
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mq3 -d mq3"]
      interval: 2s
      timeout: 5s
      retries: 20

  ingest:
    build:
      context: ..
      dockerfile: services/Dockerfile.ingest
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      DATABASE_URL: postgresql://mq3:mq3@postgres:5432/mq3
    volumes:
      - .:/opt/services
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  model:
    build:
      context: ..
      dockerfile: services/Dockerfile.model
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      DATABASE_URL: postgresql://mq3:mq3@postgres:5432/mq3
      MODEL_PATH: /opt/ml/models/sob_efeito.joblib
      PYTHONPATH: /opt/ml:/opt/services
    volumes:
      - .:/opt/services
      - ../ml:/opt/ml
    ports:
      - "127.0.0.1:8010:8010"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  grafana:
    image: grafana/grafana-oss:13.0.2
    ports:
      - "3000:3000"
    environment:
      GF_INSTALL_PLUGINS: grafana-mqtt-datasource
      GF_INSTALL_PLUGINS_FORCE: "true"
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_UID: bancada
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  pgdata:
