# O MQTT usa ws://localhost:9001 porque quem conecta é o navegador, não o processo do Grafana.
apiVersion: 1

datasources:
  - name: MQTT
    uid: mqtt
    type: grafana-mqtt-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      uri: ws://localhost:9001
      tlsAuth: false
      tlsAuthWithCACert: false
      tlsSkipVerify: false

  - name: Postgres
    uid: postgres
    type: postgres
    access: proxy
    isDefault: false
    editable: false
    url: postgres:5432
    user: mq3
    jsonData:
      database: mq3
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: mq3
