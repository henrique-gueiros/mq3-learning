# Infraestrutura da coleta: broker MQTT, banco e ingestor.
# Uso: cp .env.example .env && docker compose up -d --build
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      # WebSocket para o navegador; só no próprio computador (o frontend entra por /mqtt).
      - "127.0.0.1:9001:9001"
    volumes:
      - ./applications/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-dados:/mosquitto/data
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GRAFANA_PG_SENHA: ${GRAFANA_PG_SENHA}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./applications/db:/docker-entrypoint-initdb.d:ro
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  ingestor:
    build:
      context: ./applications
      dockerfile: coleta/Dockerfile
    environment:
      MQTT_HOST: mosquitto
      PG_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  # API somente leitura da tela (frontend/). Usa o usuário só leitura do banco.
  api:
    build:
      context: ./applications
      dockerfile: api/Dockerfile
    environment:
      API_PG_DSN: postgresql://grafana_leitor:${GRAFANA_PG_SENHA}@postgres:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Túnel de saída até o Grafana Cloud (Private Data Source Connect).
  # Sobe só com: docker compose --profile cloud up -d
  pdc:
    image: grafana/pdc-agent:0.0.67
    command:
      - -token
      - ${GCLOUD_PDC_SIGNING_TOKEN:-}
      - -cluster
      - ${GCLOUD_PDC_CLUSTER:-}
      - -gcloud-hosted-grafana-id
      - ${GCLOUD_HOSTED_GRAFANA_ID:-}
    profiles: ["cloud"]
    depends_on:
      - postgres
      - mosquitto
    restart: unless-stopped

  # Grafana local, para ver o dashboard sem o Grafana Cloud.
  # Sobe só com: docker compose --profile local up -d   (http://localhost:3000)
  grafana:
    image: grafana/grafana-oss:13.0.2
    profiles: ["local"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_INSTALL_PLUGINS: volkovlabs-echarts-panel,grafana-mqtt-datasource
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_SENHA:-admin}
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/coleta.json
      GRAFANA_PG_SENHA: ${GRAFANA_PG_SENHA}
    volumes:
      - ./applications/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./applications/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-dados:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

volumes:
  grafana-dados:
  mosquitto-dados:
  postgres-dados:
