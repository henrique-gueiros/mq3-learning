# Infraestrutura da coleta: broker MQTT, banco e ingestor.
# Uso: cp .env.example .env && docker compose up -d --build
# Airflow (ingestão → preparação → disponibilização): docker compose --profile airflow up -d --build
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      # WebSocket para o navegador. Na tela do Compose o nginx fala com ele pela rede
      # interna (/mqtt); a porta no host, só no próprio computador, serve ao `npm run dev`
      # (o Vite encaminha /mqtt para 127.0.0.1:9001).
      - "127.0.0.1:9001:9001"
    volumes:
      - ./applications/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-dados:/mosquitto/data
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LEITOR_PG_SENHA: ${LEITOR_PG_SENHA:-${GRAFANA_PG_SENHA:-}}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./applications/db:/docker-entrypoint-initdb.d:ro
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  ingestor:
    build:
      context: ./applications
      dockerfile: coleta/Dockerfile
    environment:
      MQTT_HOST: mosquitto
      PG_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  # API somente leitura da tela (frontend/). Usa o usuário só leitura do banco.
  api:
    build:
      context: ./applications
      dockerfile: api/Dockerfile
    environment:
      API_PG_DSN: postgresql://leitor:${LEITOR_PG_SENHA:-${GRAFANA_PG_SENHA:-}}@postgres:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/saude', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Tela (React) servida pelo nginx, que também encaminha /api para a API e /mqtt
  # (WebSocket) para o Mosquitto. Abra http://localhost:8080
  frontend:
    build:
      context: ./applications/frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  # Servidor do modelo. Ao vivo: assina mq3/+/eventos e, a cada sopro_fim, lê a
  # rodada no banco, classifica e publica mq3/<placa>/resultado (e grava em
  # resultados). Também responde a aba Modelo por HTTP (porta 8010).
  model:
    build:
      context: .
      dockerfile: services/Dockerfile.model
    environment:
      MQTT_HOST: mosquitto
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MODEL_PATH: /opt/ml/models/sob_efeito.joblib
      MODEL_HTTP_PORT: "8010"
      PYTHONPATH: /opt/ml:/opt/services
    volumes:
      - ./services:/opt/services
      - ./ml:/opt/ml
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    command: ["python", "-m", "mq3mqtt.ao_vivo"]
    restart: unless-stopped

  # Bônus: alerta pelo Telegram a cada resultado sob_efeito. Sem TELEGRAM_TOKEN e
  # TELEGRAM_CHAT_ID no .env, só registra no log (docker compose logs alerta).
  alerta:
    build:
      context: .
      dockerfile: services/Dockerfile.model
    environment:
      MQTT_HOST: mosquitto
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      PYTHONPATH: /opt/services
    volumes:
      - ./services:/opt/services
    depends_on:
      mosquitto:
        condition: service_started
    command: ["python", "-m", "mq3mqtt.alerta"]
    restart: unless-stopped

  # Arruma a pasta do Airflow antes do processo (o volume nasce como root).
  airflow-init:
    build:
      context: ./airflow
    user: "0:0"
    entrypoint: ["bash", "-c", "mkdir -p /opt/airflow/logs && chown -R 50000:0 /opt/airflow && chmod -R g+rwX /opt/airflow"]
    volumes:
      - airflow-home:/opt/airflow
    restart: "no"

  # Interface em http://localhost:8088 (8080 fica com a tela). DAG dataset_para_treino.
  # Senha do admin: docker compose exec airflow cat /opt/airflow/standalone_admin_password.txt
  airflow:
    build:
      context: ./airflow
    user: "50000:0"
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/ml/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      ML_ROOT: /opt/ml
      PYTHONPATH: /opt/ml
      PG_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./ml:/opt/ml
      - airflow-home:/opt/airflow
    command: standalone
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    restart: unless-stopped

  # Rastreio dos experimentos de ML (http://localhost:5050; a 5000 do macOS é do
  # AirPlay). O DAG do Airflow e o `python -m src.cli` (com
  # MLFLOW_TRACKING_URI=http://localhost:5050) registram
  # parâmetros, métricas, figuras e o modelo. Banco SQLite e artefatos no volume.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artefatos
    ports:
      - "127.0.0.1:5050:5000"
    volumes:
      - mlflow-dados:/mlflow
    restart: unless-stopped

# Rede com IPv4 e IPv6 (bônus da disciplina). O endereço IPv6 é local (ULA). O
# Mosquitto escuta nos dois; a placa pode usar o IPv6 do computador (ver
# esp32-esp8266/README.md).
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:5050:5a::/64

volumes:
  mosquitto-dados:
  postgres-dados:
  airflow-home:
  mlflow-dados:
