; Firmware do Sopro Seguro (ESP32 + MQ-3, MQ-135, DHT11).
; Como configurar e testar: README.md desta pasta.

[platformio]
; "pio run" compila so a placa; os testes de PC rodam com "pio test -e native".
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.0.1  ; core arduino-esp32 2.0.17 (o código usa as APIs dele)
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = leituras, send_on_enter
upload_speed = 315200
lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    knolleary/PubSubClient@^2.8

; Testes do protocolo (CSV, JSON, UUID, ppm) no computador, sem placa.
[env:native]
platform = native
test_build_src = no
