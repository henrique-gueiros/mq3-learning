name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tela:
    name: Tela
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: applications/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  python:
    name: Python
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: t
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_DSN: postgresql://postgres:t@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            applications/coleta/requirements.txt
            applications/api/requirements.txt
      - run: pip install -r ml/requirements.txt -r applications/coleta/requirements.txt -r applications/api/requirements.txt
      - run: python -m pytest -q
        working-directory: applications
      - run: python -m pytest -q
        working-directory: ml
      - run: python -m pytest -q
        working-directory: services
