# Data sources do Grafana local (docker compose --profile local). No Grafana Cloud
# eles são criados à mão; veja applications/grafana/README.md.
apiVersion: 1

datasources:
  - name: PostgreSQL
    uid: mq3-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_leitor
    editable: false
    jsonData:
      database: mq3
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $GRAFANA_PG_SENHA

  - name: MQTT
    uid: mq3-mqtt
    type: grafana-mqtt-datasource
    access: proxy
    editable: false
    jsonData:
      uri: tcp://mosquitto:1883
