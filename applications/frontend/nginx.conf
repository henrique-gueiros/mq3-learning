server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno do Docker. Com o nome numa variável, o nginx resolve a cada pedido
  # e sobe mesmo que api ou mosquitto ainda não existam.
  resolver 127.0.0.11 valid=10s;

  # Arquivos com hash no nome nunca mudam: cache longo só aqui.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # API somente leitura. A URI original (/api/...) segue como está.
  location /api/ {
    set $api http://api:8000;
    proxy_pass $api;
    proxy_set_header Host $http_host;
  }

  # Aba Modelo: recorte de sopro entra, a classe sai. O serviço não grava no banco.
  location /modelo/ {
    set $modelo http://model:8010;
    proxy_pass $modelo;
    proxy_set_header Host $http_host;
  }

  # MQTT sobre WebSocket para o Mosquitto. Conexão longa, sem o timeout padrão de 60 s.
  location /mqtt {
    set $broker http://mosquitto:9001;
    proxy_pass $broker;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
  }

  # Rotas da tela (ex.: /design-system) caem no index.html ao recarregar.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
