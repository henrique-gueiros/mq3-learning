# Broker da coleta. Sem senha: use só na rede local da coleta (limitação registrada).
listener 1883
allow_anonymous true

# MQTT sobre WebSocket, para o navegador (a tela em frontend/) assinar as leituras ao vivo.
# Fica só na rede interna do Compose: o navegador entra pelo nginx do frontend, em /mqtt.
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
