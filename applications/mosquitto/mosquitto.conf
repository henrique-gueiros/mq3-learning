# Broker da coleta. Sem senha: use só na rede local da coleta (limitação registrada).
listener 1883
allow_anonymous true

# MQTT sobre WebSocket, para o navegador (a tela em frontend/) assinar as leituras ao vivo.
# O navegador entra pelo nginx do frontend, em /mqtt. No host a porta fica só em
# 127.0.0.1, para o `npm run dev` (o Vite encaminha /mqtt para cá).
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
